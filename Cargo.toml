[package]
name = "cinematicket-lint"
version = "0.9.0"
edition = "2021"
description = "Pre-commit checks (CT01-CT18) for code-style rules ruff and pylint cannot express"
license = "MIT"
readme = "README.md"

[[bin]]
name = "cinematicket-lint"
path = "src/main.rs"

[dependencies]
ruff_python_ast = "0.0.21"
ruff_python_parser = "0.0.21"
ruff_text_size = "0.0.21"
ruff_source_file = "0.0.21"
toml = "0.8"
serde_json = "1"
regex = "1"
walkdir = "2"
rayon = "1"
globset = "0.4"

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
