[project]
name = "cinematicket-lint"
version = "0.4.0"
description = "Pre-commit checks (CT01-CT07) for code-style rules ruff and pylint cannot express"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }

[project.scripts]
cinematicket-lint = "cinematicket_lint.cli:main"

[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
line-length = 120
target-version = "py311"

[tool.ruff.lint]
select = ["E", "W", "F", "I", "Q", "ANN"]

[tool.ruff.lint.flake8-quotes]
inline-quotes = "single"
docstring-quotes = "double"

[tool.ruff.format]
quote-style = "single"
